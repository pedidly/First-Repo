<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know Their Names</title>
<meta name="description" content="A private flashcard and quiz app that helps youth leaders learn every student's name from their photo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0663a'/%3E%3Ccircle cx='16' cy='12.5' r='5' fill='%23fff'/%3E%3Cpath d='M6.5 26c1.4-5 5-7.5 9.5-7.5s8.1 2.5 9.5 7.5Z' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#fbf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Names">
<style>
/* ============================================================
   Know Their Names — single-file app
   All data lives in this browser (IndexedDB). Nothing is uploaded.
   ============================================================ */
:root {
  color-scheme: light;
  --plane:     #fbf7f2;
  --surface:   #ffffff;
  --surface-2: #f4eee6;
  --line:      #e6ddd1;
  --ink:       #231d17;
  --ink-2:     #5b5147;
  --muted:     #867a6e;
  --accent:    #c4502a;
  --accent-ink:#ffffff;
  --accent-soft:#fbe6dc;
  --good:      #1f7a4d;
  --good-soft: #dcf1e5;
  --bad:       #b3261e;
  --bad-soft:  #fbe0de;
  --shadow:    0 1px 2px rgba(35,29,23,.06), 0 6px 20px rgba(35,29,23,.07);
  --radius:    16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:     #16130f;
    --surface:   #211c17;
    --surface-2: #2b251f;
    --line:      #3a322a;
    --ink:       #f6efe7;
    --ink-2:     #cbbfb2;
    --muted:     #9c8f82;
    --accent:    #ee8a62;
    --accent-ink:#1b120d;
    --accent-soft:#3f2a20;
    --good:      #6fd39c;
    --good-soft: #1d3527;
    --bad:       #f2877f;
    --bad-soft:  #3d2220;
    --shadow:    0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:     #16130f;
  --surface:   #211c17;
  --surface-2: #2b251f;
  --line:      #3a322a;
  --ink:       #f6efe7;
  --ink-2:     #cbbfb2;
  --muted:     #9c8f82;
  --accent:    #ee8a62;
  --accent-ink:#1b120d;
  --accent-soft:#3f2a20;
  --good:      #6fd39c;
  --good-soft: #1d3527;
  --bad:       #f2877f;
  --bad-soft:  #3d2220;
  --shadow:    0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 16px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 0 10px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center;
}
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- bottom tabs ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button {
  background: none; border: 0; padding: 10px 0 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 12px; font-weight: 600; color: var(--muted);
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); }

/* ---------- common ---------- */
h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.02em; margin: 8px 0 4px; }
h2 { font-size: 18px; margin: 0 0 8px; }
p.sub { color: var(--ink-2); margin: 0 0 18px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
}
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 11px 16px; font-weight: 600; min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
label.field { display: block; }
label.field span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
input[type=text], select {
  width: 100%; min-height: 46px; padding: 10px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
input[type=text]:focus, select:focus, .btn:focus-visible, button:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px;
}
.pill {
  display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
}
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- home / progress ---------- */
.progress-card { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.ring { width: 84px; height: 84px; }
.ring text { font-weight: 700; font-size: 20px; fill: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.modes { display: grid; gap: 10px; }
.mode {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
}
.mode .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.mode .ic svg { width: 26px; height: 26px; }
.mode b { display: block; font-size: 16px; }
.mode small { color: var(--muted); font-size: 13px; }
.mode .chev { color: var(--muted); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- empty state ---------- */
.empty { text-align: center; padding: 28px 18px; }
.empty .art { width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 28px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.empty .art svg { width: 52px; height: 52px; }

/* ---------- quiz ---------- */
.qbar { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
.qbar .track { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.qbar .fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.qbar .count { font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 44px; text-align: right; }
.photo {
  width: 100%; aspect-ratio: 4 / 5; max-height: 52vh; object-fit: cover; object-position: center 30%;
  border-radius: var(--radius); background: var(--surface-2); box-shadow: var(--shadow);
}
.photo-wrap { position: relative; max-width: 380px; margin: 0 auto; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.choice {
  min-height: 56px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 16px; text-align: center; line-height: 1.2;
}
.choice.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.faces { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.face {
  padding: 0; border: 3px solid transparent; border-radius: 18px; background: none; overflow: hidden; position: relative;
}
.face img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: center 30%; background: var(--surface-2); }
.face.right { border-color: var(--good); }
.face.wrong { border-color: var(--bad); }
.face .tag {
  position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 4px 6px; border-radius: 8px;
  background: rgba(0,0,0,.62); color: #fff; font-size: 13px; font-weight: 600; text-align: center;
}
.prompt-name { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 10px 0 2px; }
.feedback {
  margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .btn { min-height: 40px; padding: 8px 14px; }
.type-row { display: flex; gap: 8px; margin-top: 14px; }
.type-row input { flex: 1; font-size: 18px; }

/* ---------- flashcards ---------- */
.flash { perspective: 1200px; max-width: 380px; margin: 0 auto; }
.flash-inner { position: relative; transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flash-back {
  position: absolute; inset: 0; transform: rotateY(180deg); border-radius: var(--radius); overflow: hidden;
}
.flash-back img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
.flash-back .name-band {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 18px; text-align: center;
  background: linear-gradient(transparent, rgba(0,0,0,.78)); color: #fff;
}
.flash-back .name-band b { display: block; font-size: 28px; letter-spacing: -.01em; }
.flash-back .name-band span { font-size: 14px; opacity: .85; }
.hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }

/* ---------- results ---------- */
.score-big { font-size: 56px; font-weight: 800; letter-spacing: -.03em; text-align: center; line-height: 1; margin: 10px 0 4px; }
.missed { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.missed figure { margin: 0; }
.missed img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: center 30%; border-radius: 12px; background: var(--surface-2); }
.missed figcaption { font-size: 13px; font-weight: 600; text-align: center; margin-top: 4px; line-height: 1.2; }

/* ---------- roster ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input { flex: 1 1 180px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.kid {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  padding: 0; text-align: left; box-shadow: var(--shadow);
}
.kid img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: center 30%; background: var(--surface-2); }
.kid .meta { padding: 7px 8px 9px; }
.kid .meta b { display: block; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kid .dots { display: flex; gap: 3px; margin-top: 5px; }
.kid .dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.kid .dots i.on { background: var(--good); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px; }
.section-title h2 { margin: 0; }

/* ---------- dialogs ---------- */
dialog {
  border: 0; padding: 0; border-radius: 20px; background: var(--surface); color: var(--ink);
  width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(20,15,10,.5); }
.dlg { padding: 18px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.dlg-head h2 { margin: 0; }
.edit-photo {
  width: 140px; aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; background: var(--surface-2);
  margin: 0 auto 12px; position: relative; display: grid; place-items: center; color: var(--muted); text-align: center; font-size: 13px;
}
.edit-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
.bulk-list { display: grid; gap: 8px; max-height: 50vh; overflow: auto; padding-right: 2px; }
.bulk-item { display: grid; grid-template-columns: 56px 1fr 40px; gap: 10px; align-items: center; }
.bulk-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
.note {
  font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px;
}
.note b { color: var(--ink); }
.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--plane); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); text-align: center;
}
@media (max-width: 380px) {
  .choices { grid-template-columns: 1fr; }
  .opts { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .flash-inner, .qbar .fill { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><circle cx="16" cy="12.5" r="5" fill="#fff"/><path d="M6.5 26c1.4-5 5-7.5 9.5-7.5s8.1 2.5 9.5 7.5Z" fill="#fff"/></svg>
      </div>
      Know Their Names
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle light and dark">

      Roster

    <button role="tab" data-tab="share" aria-selected="false">

<!-- Add / edit one student -->

  <form class="dlg" method="dialog" id="editForm">

<input type="file" accept="application/json,.json" id="importInput" class="sr">

<script>
(() => {
'use strict';

/* ============================================================
   Storage: IndexedDB, one "kids" store. Everything stays local.
   ============================================================ */
const DB_NAME = 'know-their-names';
const STORE = 'kids';
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, mode);
    const s = t.objectStore(STORE);
    const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const store = {
  all: () => tx('readonly', s => s.getAll()),
  put: kid => tx('readwrite', s => s.put(kid)),
  putMany: kids => tx('readwrite', s => { kids.forEach(k => s.put(k)); }),
  del: id => tx('readwrite', s => s.delete(id)),
  clear: () => tx('readwrite', s => s.clear()),
};

function prefGet(k, d) { try { const v = localStorage.getItem('ktn:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function prefSet(k, v) { try { localStorage.setItem('ktn:' + k, JSON.stringify(v)); } catch {} }

/* ============================================================
   State
   ============================================================ */
let kids = [];
let tab = 'practice';
let session = null;        // active quiz / study session
let editingId = null;
let editPhoto = null;
let bulkItems = [];
let groupFilter = prefGet('group', '');
let roundSize = prefGet('roundSize', 10);
let rosterQuery = '';

const MAX_BOX = 5;         // Leitner boxes: 1 = new/missed … 5 = solid
const KNOWN_BOX = 3;       // counts as "knows this name"

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const displayName = k => k.nick ? `${k.nick} ${k.name.split(/\s+/).slice(1).join(' ')}`.trim() : k.name;
const box = k => k.box || 1;

/* ============================================================
   Photos: downscale to a small JPEG so hundreds fit comfortably.
   ============================================================ */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { res(img); URL.revokeObjectURL(url); };
    img.onerror = () => { rej(new Error('Could not read that image')); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
async function shrinkPhoto(file, max = 560) {
  const img = await loadImage(file);
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.82);
}
function nameFromFile(fname) {
  let n = fname.replace(/\.[a-z0-9]+$/i, '').replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (/^(img|dsc|photo|image|pxl|screenshot)\s*\d/i.test(n) || /^\d+$/.test(n)) return '';
  return n.replace(/\b\w/g, c => c.toUpperCase());
}

/* ============================================================
   Practice engine
   ============================================================ */
function pool() {
  return kids.filter(k => !groupFilter || k.group === groupFilter);
}
// Pick a round: weakest boxes first, least-recently-seen breaks ties, shuffled.
function pickRound(n) {
  const p = pool();
  const ranked = shuffle(p).sort((a, b) => box(a) - box(b) || (a.last || 0) - (b.last || 0));
  return shuffle(ranked.slice(0, Math.min(n, ranked.length)));
}
function distractors(target, count, from) {
  const others = shuffle(from.filter(k => k.id !== target.id && k.name !== target.name));
  // Prefer same group so it isn't too easy.
  const same = others.filter(k => k.group && k.group === target.group);
  const rest = others.filter(k => !same.includes(k));
  return same.concat(rest).slice(0, count);
}
async function record(kid, correct) {
  kid.seen = (kid.seen || 0) + 1;
  kid.last = Date.now();
  if (correct) { kid.right = (kid.right || 0) + 1; kid.box = Math.min(MAX_BOX, box(kid) + 1); }
  else kid.box = 1;
  await store.put(kid);
}
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim(); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
// Accepts full name, first name, or "goes by" name, with a small typo allowance.
function typedMatches(input, kid) {
  const g = norm(input); if (!g) return false;
  const full = norm(kid.name), first = full.split(' ')[0], nick = norm(kid.nick || '');
  const targets = [full, first, nick, nick && (nick + ' ' + full.split(' ').slice(1).join(' ')).trim()].filter(Boolean);
  return targets.some(t => t === g || (t.length >= 4 && lev(t, g) <= (t.length >= 8 ? 2 : 1)));
}

function startSession(mode) {
  const round = pickRound(mode === 'study' ? Math.max(roundSize, 20) : roundSize);
  session = { mode, round, i: 0, score: 0, missed: [], answered: false, flipped: false };
  render();
}

function renderQuestion() {
  const s = session, kid = s.round[s.i], all = pool();
  let body = '';
  if (s.mode === 'pick') {
    s.opts = s.opts || shuffle([kid, ...distractors(kid, 3, all)]);
    body = `
      <div class="photo-wrap"><img class="photo" src="${kid.photo}" alt="Who is this?"></div>
      <div class="choices">${s.opts.map(o => `<button class="choice" data-id="${o.id}">${esc(displayName(o))}</button>`).join('')}</div>`;
  } else if (s.mode === 'face') {
    s.opts = s.opts || shuffle([kid, ...distractors(kid, 3, all)]);
    body = `
      <p class="small muted" style="text-align:center;margin:0">Which one is</p>
      <div class="prompt-name">${esc(displayName(kid))}</div>
      <div class="faces">${s.opts.map(o => `<button class="face" data-id="${o.id}"><img src="${o.photo}" alt=""></button>`).join('')}</div>`;
  } else {
    body = `
      <div class="photo-wrap"><img class="photo" src="${kid.photo}" alt="Who is this?"></div>
      <form class="type-row" id="typeForm" autocomplete="off">
        <input type="text" id="typeIn" placeholder="First name is fine" autocapitalize="words" autocomplete="off" spellcheck="false" aria-label="Their name">
        <button class="btn primary">Check</button>
      </form>
      <button class="btn ghost block" id="dunno" style="margin-top:8px">I don't know</button>`;
  }
  app.innerHTML = qHeader() + body + '<div id="fb"></div>';
  wireQuit();

  if (s.mode === 'type') {
    const inp = $('#typeIn');
    inp.focus();
    $('#typeForm').onsubmit = e => { e.preventDefault(); if (inp.value.trim()) answer(typedMatches(inp.value, kid)); };
    $('#dunno').onclick = () => answer(false);
  } else {
    app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      if (s.answered) return;
      const ok = b.dataset.id === kid.id;
      app.querySelectorAll('[data-id]').forEach(x => {
        if (x.dataset.id === kid.id) x.classList.add('right');
        else if (x === b) x.classList.add('wrong');
        if (s.mode === 'face') {
          const o = s.opts.find(k => k.id === x.dataset.id);
          x.insertAdjacentHTML('beforeend', `<span class="tag">${esc(displayName(o))}</span>`);
        }
      });
      answer(ok);
    });
  }
}

async function answer(ok) {
  const s = session; if (s.answered) return;
  s.answered = true;
  const kid = s.round[s.i];
  if (ok) s.score++; else s.missed.push(kid);
  await record(kid, ok);
  if (s.mode === 'type') {
    $('#typeIn').disabled = true;
    $('#typeForm button').disabled = true;
    $('#dunno').classList.add('hidden');
  }
  const extra = kid.nick ? ` (${esc(kid.name)})` : '';
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}" role="status">
    <span>${ok ? 'Yes! ' : 'That’s '}${esc(displayName(kid))}${extra}${ok ? '' : '.'}</span>
    <button class="btn ${ok ? '' : 'primary'}" id="next">${s.i + 1 < s.round.length ? 'Next' : 'See results'}</button>
  </div>`;
  const next = $('#next');
  next.focus();
  next.onclick = advance;
}
function advance() {
  const s = session;
  s.i++; s.answered = false; s.opts = null; s.flipped = false;
  if (s.i >= s.round.length) s.done = true;
  render();
  window.scrollTo({ top: 0 });
}

function renderStudy() {
  const s = session, kid = s.round[s.i];
  app.innerHTML = qHeader() + `
    <div class="flash ${s.flipped ? 'flipped' : ''}" id="flash">
      <div class="flash-inner">
        <div class="flash-face"><img class="photo" src="${kid.photo}" alt="Who is this?"></div>
        <div class="flash-back" aria-hidden="${!s.flipped}">
          <img src="${kid.photo}" alt="">
          <div class="name-band"><b>${esc(displayName(kid))}</b>${kid.nick || kid.group ? `<span>${esc([kid.nick ? kid.name : '', kid.group].filter(Boolean).join(' · '))}</span>` : ''}</div>

      </div>
    </div>
    ${s.flipped ? `
      <div class="choices">
        <button class="btn" id="again">Still learning</button>
        <button class="btn primary" id="gotit">I knew it</button>
      </div>` : `
      <button class="btn primary block" id="flip" style="margin-top:14px">Show name</button>
      <p class="hint">Say their name out loud first, then flip.</p>`}

}

  app.innerHTML = `
    <h1>Share with leaders</h1>
    <p class="sub">There's no account or server. To give another leader the roster, send them a file.</p>
    <div class="card stack">
      <h2>Send the roster</h2>
      <p class="small muted" style="margin:0">Saves one file with every name and photo. Send it to other leaders by text, AirDrop, or email. They open this app and choose "Load a roster file."</p>
      <button class="btn primary block" id="exportBtn" ${kids.length ? '' : 'disabled'}>Save roster file</button>
    </div>
    <div class="card stack" style="margin-top:12px">
      <h2>Load a roster file</h2>
      <p class="small muted" style="margin:0">Adds everyone from a file another leader sent you. Anyone already on your roster is updated rather than added twice, and your quiz progress is kept.</p>
      <button class="btn block" id="importBtn">Choose file</button>
    </div>
    <div class="note" style="margin-top:12px">
      <b>These are photos of minors.</b> Share the file only with leaders your church has approved, and delete it from chats or email once they've loaded it. Follow your church's policy on student photos, and get parents' permission if the policy calls for it.
    </div>
    <div class="card stack" style="margin-top:12px">
      <h2>This device</h2>
      <p class="small muted" style="margin:0">Photos are saved only in this browser. Clearing your browser data erases them too, so keep a roster file somewhere safe.</p>
      <button class="btn danger block" id="resetProgress" ${kids.length ? '' : 'disabled'}>Reset my quiz progress</button>
      <button class="btn danger block" id="wipe" ${kids.length ? '' : 'disabled'}>Delete all students from this device</button>
    </div>`;
  $('#exportBtn').onclick = exportRoster;
  $('#importBtn').onclick = () => $('#importInput').click();
  $('#resetProgress').onclick = async () => {
    if (!confirm('Reset quiz progress for everyone? Names and photos stay.')) return;
    kids.forEach(k => { k.box = 1; k.seen = 0; k.right = 0; k.last = 0; });
    await store.putMany(kids); await reload(); toast('Progress reset');
  };
  $('#wipe').onclick = async () => {
    if (!confirm(`Delete all ${kids.length} students and photos from this device? This can't be undone unless you have a roster file.`)) return;
    await store.clear(); await reload(); toast('Everything deleted from this device');
  };
}

/* ============================================================
   Add / edit dialog
   ============================================================ */
const editDlg = $('#editDlg');
function fillGroupList() { $('#groupList').innerHTML = groups().map(g => `<option value="${esc(g)}">`).join(''); }
function setEditPhoto(src) {
  editPhoto = src;
  $('#editPhotoImg').classList.toggle('hidden', !src);
  $('#editPhotoHint').classList.toggle('hidden', !!src);
  if (src) $('#editPhotoImg').src = src;
}
function openEdit(id) {
  editingId = id;
  const k = id ? kids.find(x => x.id === id) : null;
  fillGroupList();
  $('#editTitle').textContent = k ? 'Edit student' : 'Add a student';
  $('#editName').value = k ? k.name : '';
  $('#editNick').value = k ? k.nick || '' : '';
  $('#editGroup').value = k ? k.group || '' : (groupFilter || '');
  $('#editDelete').classList.toggle('hidden', !k);
  $('#editPhotoInput').value = '';
  setEditPhoto(k ? k.photo : null);
  editDlg.showModal();
}
$('#editPhotoInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    setEditPhoto(await shrinkPhoto(f));
    if (!$('#editName').value) $('#editName').value = nameFromFile(f.name);
  } catch (err) { toast(err.message); }
};
$('#editForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('#editName').value.trim();
  if (!name) return $('#editName').focus();
  if (!editPhoto) { toast('Add a photo first'); return; }
  const prev = editingId ? kids.find(x => x.id === editingId) : null;
  const kid = Object.assign({}, prev || { id: uid(), box: 1, seen: 0, right: 0, added: Date.now() }, {
    name, nick: $('#editNick').value.trim(), group: $('#editGroup').value.trim(), photo: editPhoto,
  });
  delete kid.sample;
  await store.put(kid);
  editDlg.close();
  await reload();
  toast(prev ? 'Saved' : `Added ${name}`);
};
$('#editDelete').onclick = async () => {
  const k = kids.find(x => x.id === editingId);
  if (!k || !confirm(`Remove ${k.name}?`)) return;
  await store.del(k.id);
  editDlg.close();
  await reload();
  toast(`Removed ${k.name}`);
};

/* ============================================================
   Bulk add
   ============================================================ */
const bulkDlg = $('#bulkDlg');
$('#bulkInput').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  toast(`Preparing ${files.length} photo${files.length > 1 ? 's' : ''}…`);
  bulkItems = [];
  for (const f of files) {
    try { bulkItems.push({ key: uid(), photo: await shrinkPhoto(f), name: nameFromFile(f.name) }); }
    catch { /* skip unreadable files */ }
  }
  if (!bulkItems.length) { toast('None of those could be read as photos'); return; }
  fillGroupList();
  $('#bulkGroup').value = groupFilter || '';
  renderBulk();
  bulkDlg.showModal();
};
function renderBulk() {
  $('#bulkList').innerHTML = bulkItems.map(it => `
    <div class="bulk-item" data-key="${it.key}">
      <img src="${it.photo}" alt="">
      <input type="text" value="${esc(it.name)}" placeholder="Their name" aria-label="Name for this photo" autocapitalize="words">
      <button class="icon-btn" aria-label="Skip this photo">${ICONS.x}</button>
    </div>`).join('');
  $('#bulkList').querySelectorAll('.bulk-item').forEach(row => {
    const it = bulkItems.find(x => x.key === row.dataset.key);
    row.querySelector('input').oninput = e => { it.name = e.target.value; };
    row.querySelector('button').onclick = () => { bulkItems = bulkItems.filter(x => x !== it); renderBulk(); };
  });
  const first = $('#bulkList input[value=""]');
  if (first) first.focus();
}
$('#bulkSave').onclick = async () => {
  const group = $('#bulkGroup').value.trim();
  const now = Date.now();
  const ready = bulkItems.filter(it => it.name.trim()).map((it, i) => ({
    id: uid(), name: it.name.trim(), nick: '', group, photo: it.photo, box: 1, seen: 0, right: 0, added: now + i,
  }));
  if (!ready.length) { toast('Type at least one name'); return; }
  await store.putMany(ready);
  bulkDlg.close();
  await reload();
  toast(`Added ${ready.length} student${ready.length > 1 ? 's' : ''}`);
};

document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

/* ============================================================
   Export / import
   ============================================================ */
function exportRoster() {
  const data = {
    app: 'know-their-names', version: 1, exported: new Date().toISOString(),
    students: kids.filter(k => !k.sample).map(({ name, nick, group, photo }) => ({ name, nick, group, photo })),
  };
  if (!data.students.length) { toast('Only sample students so far. Add real ones first.'); return; }
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `youth-roster-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Saved ${data.students.length} students`);
}
$('#importInput').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data.students) ? data.students : null;
    if (data.app !== 'know-their-names' || !list) throw new Error();
    const key = k => norm(k.name) + '|' + norm(k.group || '');
    const existing = new Map(kids.map(k => [key(k), k]));
    let added = 0, updated = 0;
    const now = Date.now();
    const out = [];
    list.forEach((s, i) => {
      if (!s || typeof s.name !== 'string' || !s.name.trim() || typeof s.photo !== 'string' || !/^data:image\//.test(s.photo)) return;
      const clean = { name: s.name.trim().slice(0, 80), nick: String(s.nick || '').trim().slice(0, 40), group: String(s.group || '').trim().slice(0, 40), photo: s.photo };
      const prev = existing.get(key(clean));
      if (prev) { out.push(Object.assign({}, prev, clean)); updated++; }
      else { out.push({ id: uid(), ...clean, box: 1, seen: 0, right: 0, added: now + i }); added++; }
    });
    await store.putMany(out);
    await reload();
    toast(`Loaded: ${added} new, ${updated} updated`);
  } catch {
    toast('That isn’t a roster file from this app');
  }
};

/* ============================================================
   Theme, tabs, boot
   ============================================================ */
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(prefGet('theme', ''));
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next); prefSet('theme', next);
};
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => {
  session = null; tab = b.dataset.tab; render(); window.scrollTo({ top: 0 });
});
app.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { tab = go.dataset.go; render(); }
});

async function reload() {
  kids = await store.all();
  if (groupFilter && !kids.some(k => k.group === groupFilter)) groupFilter = '';
  render();
}

reload().catch(() => {
  app.innerHTML = `<div class="card empty"><h1>Storage is blocked</h1>
    <p class="sub">This browser won't let the app save photos (private browsing can do this). Open it in a normal window.</p></div>`;
});
})();
</script>
</body>
</html>
